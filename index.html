<title>huhphilgoo</title>
<style>
  :root{--ground:#F1F2F4;--ink:#14161A;--muted:#5B6371;--line:#DCDEE3;--accent:#ED1C24}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0E1013;--ink:#ECEEF2;--muted:#98A0AE;--line:#282C34;--accent:#FF4A44}}
  :root[data-theme="dark"]{--ground:#0E1013;--ink:#ECEEF2;--muted:#98A0AE;--line:#282C34;--accent:#FF4A44}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
    display:grid;place-items:center;min-height:100vh;padding:32px}
  main{max-width:34rem}
  h1{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
    font-size:1.5rem;letter-spacing:-.02em;margin:0 0 10px}
  p{color:var(--muted);line-height:1.6;margin:0 0 22px}
  ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
  a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
  a:hover{border-color:var(--accent)}
</style>
<main>
  <h1>huhphilgoo</h1>
  <p>Apps by 허필구.</p>
