<!doctype html>
<!--
  PaintBoardPro 광고 이미지 틀. 1600×1000 한 장 = 장면 하나.
  주소 뒤에 #scene=hero&lang=ko 처럼 붙여 장면과 언어를 고른다.
  장면: hero · pens · shapes · fill · text · fold      언어: ko · en · ja
  그림은 전부 앱으로 실제로 그린 것(raw/, paintboard 저장소의
  integration_test/landing_art.dart 가 그린다). 여기서 더하는 것은 기기 틀,
  확대경, 탭 표시, 말풍선뿐이다.
-->
<html><head><meta charset="utf-8">
<style>
:root{
  --bg1:#f6f8fb; --bg2:#eef1f6; --ink:#16191f; --muted:#5b6371;
  --tone:#0a84ff;           /* 앱의 선택 도구 파랑 */
  --em:#0b63c4;             /* 밝은 바탕 위 강조 글자 — 진한 파랑 */
  --pink:#e9407a; --amber:#f2a516; --green:#1f9d58;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:-apple-system,"Apple SD Gothic Neo","Hiragino Sans",sans-serif;color:var(--ink);position:relative;
  background:radial-gradient(820px 520px at 82% 86%,rgba(10,132,255,.13),transparent 70%),
             radial-gradient(700px 480px at 8% 92%,rgba(233,64,122,.11),transparent 70%),
             radial-gradient(600px 400px at 50% 0%,rgba(242,165,22,.10),transparent 70%),
             linear-gradient(180deg,var(--bg1),var(--bg2));}
html:lang(en) body{font-family:system-ui,"Helvetica Neue",-apple-system,sans-serif}
html:lang(ja) body{font-family:"Hiragino Sans",system-ui,sans-serif}
.scene{display:none;position:absolute;inset:0}
.scene.on{display:block}

.head{position:absolute;left:80px;right:80px;top:56px;text-align:center}
.head h1{font-size:72px;font-weight:800;letter-spacing:-2px;line-height:1.12;word-break:keep-all}
.head h1 em{font-style:normal;color:var(--em)}
.head p{margin-top:16px;font-size:26px;color:var(--muted);letter-spacing:-.3px;word-break:keep-all}

/* 태블릿(가로) — 화면 비율 4:3, 앱 캡처 그대로 */
.tablet{position:absolute;background:#111317;border-radius:42px;padding:20px;
  box-shadow:0 0 0 3px #343943,0 40px 80px rgba(25,32,45,.28)}
.tablet .glass{border-radius:24px;overflow:hidden;position:relative;aspect-ratio:4/3;background:#f2f2f7}
.tablet img{width:100%;height:100%;display:block}
/* 폴더블(펼친 안쪽 화면) — 2853:2007 */
.fold{position:absolute;background:#111317;border-radius:38px;padding:16px;
  box-shadow:0 0 0 3px #343943,0 40px 80px rgba(25,32,45,.28)}
.fold .glass{border-radius:24px;overflow:hidden;position:relative;aspect-ratio:2853/2007}
.fold img{width:100%;height:100%;display:block}
.fold:after{content:"";position:absolute;top:16px;bottom:16px;left:50%;width:2px;margin-left:-1px;
  background:linear-gradient(180deg,rgba(0,0,0,.0),rgba(0,0,0,.10) 20%,rgba(0,0,0,.10) 80%,rgba(0,0,0,0))}

.card{position:absolute;border-radius:24px;overflow:hidden;background:#fff;
  box-shadow:0 30px 70px rgba(25,32,45,.18),0 0 0 1px rgba(25,32,45,.06)}
.card img{display:block;width:100%}
.card .lab{position:absolute;left:18px;top:16px;font-size:23px;font-weight:700;color:var(--muted);
  background:rgba(255,255,255,.9);padding:6px 14px;border-radius:999px}

.chip{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;
  background:#fff;border:1.5px solid rgba(11,99,196,.22);font-size:22px;font-weight:700;color:var(--ink);
  box-shadow:0 12px 28px rgba(25,32,45,.12);max-width:340px;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere;z-index:6}
.chip span{font-size:24px}
.bubble{position:absolute;padding:10px 18px;border-radius:14px;background:var(--tone);color:#fff;
  font-weight:800;font-size:22px;box-shadow:0 10px 26px rgba(10,132,255,.4);white-space:nowrap;z-index:7}
.arrow{position:absolute;height:4px;background:linear-gradient(90deg,rgba(10,132,255,.15),var(--tone));z-index:5}
.arrow:after{content:"";position:absolute;right:-6px;top:-9px;border:11px solid transparent;border-left:16px solid var(--tone)}

/* 확대경 — 같은 그림의 한 부분을 크게 */
.lens{position:absolute;border-radius:50%;border:7px solid #fff;z-index:6;
  box-shadow:0 0 0 2px rgba(10,132,255,.35),0 22px 48px rgba(25,32,45,.25);background-repeat:no-repeat}
.lens + .tag{position:absolute;z-index:6;font-size:22px;font-weight:800;color:var(--ink);line-height:1.3;
  background:#fff;padding:10px 18px;border-radius:16px;box-shadow:0 8px 20px rgba(25,32,45,.12);max-width:340px;word-break:keep-all;overflow-wrap:anywhere;transform:translateY(-50%)}
/* 탭 표시 — 손가락이 닿은 자리 */
.tap{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;z-index:6;
  background:rgba(255,255,255,.35);border:4px solid #fff;box-shadow:0 0 0 6px rgba(10,132,255,.45),0 0 30px rgba(10,132,255,.6)}
.tap:after{content:"";position:absolute;inset:18px;border-radius:50%;background:#fff}
</style></head>
<body>

<!-- 1. 대표 ─────────────────────────────── -->
<section class="scene" id="hero">
  <div class="head"><h1 data-t="hero.h"></h1><p data-t="hero.p"></p></div>
  <div class="tablet" style="left:470px;top:262px;width:820px"><div class="glass"><img data-src="village_ui"></div></div>
  <div class="fold" style="left:90px;top:560px;width:500px;transform:rotate(-4deg);z-index:4"><div class="glass"><img data-src="duo"></div></div>
  <div class="chip" style="left:1240px;top:310px"><span>🖊️</span><b data-t="c.pens"></b></div>
  <div class="chip" style="left:1280px;top:470px"><span>✍️</span><b data-t="c.pressure"></b></div>
  <div class="chip" style="left:1260px;top:630px"><span>⭐</span><b data-t="c.shapes"></b></div>
  <div class="chip" style="left:1240px;top:790px"><span>🪣</span><b data-t="c.fill"></b></div>
</section>

<!-- 2. 펜촉 ─────────────────────────────── -->
<section class="scene" id="pens">
  <div class="head"><h1 data-t="pens.h"></h1><p data-t="pens.p"></p></div>
  <div class="tablet" style="left:90px;top:262px;width:880px"><div class="glass"><img data-src="bouquet_ui"></div></div>
  <div class="lens" data-lens="bouquet_art 0.40 0.21 0.17" style="left:1010px;top:250px;width:210px;height:210px"></div>
  <div class="tag" style="left:1240px;top:355px" data-t="pens.hl"></div>
  <div class="lens" data-lens="bouquet_art 0.50 0.70 0.30" style="left:1010px;top:490px;width:210px;height:210px"></div>
  <div class="tag" style="left:1240px;top:595px" data-t="pens.pr"></div>
  <div class="lens" data-lens="bouquet_art 0.45 0.48 0.17" style="left:1010px;top:730px;width:210px;height:210px"></div>
  <div class="tag" style="left:1240px;top:835px" data-t="pens.cal"></div>
</section>

<!-- 3. 도형 ─────────────────────────────── -->
<section class="scene" id="shapes">
  <div class="head"><h1 data-t="shapes.h"></h1><p data-t="shapes.p"></p></div>
  <div class="card" style="left:90px;top:300px;width:620px"><img data-src="shapes_before" data-nolang><span class="lab" data-t="shapes.before"></span></div>
  <div class="arrow" style="left:740px;top:530px;width:120px"></div>
  <div class="bubble" style="left:700px;top:450px" data-t="shapes.hold"></div>
  <div class="card" style="left:890px;top:300px;width:620px"><img data-src="shapes_after" data-nolang><span class="lab" data-t="shapes.after"></span></div>
  <div class="chip" style="left:560px;top:820px"><span>↩️</span><b data-t="shapes.undo"></b></div>
</section>

<!-- 4. 페인트통 ─────────────────────────── -->
<section class="scene" id="fill">
  <div class="head"><h1 data-t="fill.h"></h1><p data-t="fill.p"></p></div>
  <div class="tablet" id="filltab" style="left:350px;top:262px;width:900px"><div class="glass"><img data-src="city_ui">
    <div class="tap" data-at="0.14 0.74"></div><div class="tap" data-at="0.505 0.78"></div><div class="tap" data-at="0.84 0.22"></div>
  </div></div>
  <div class="bubble" style="left:440px;top:650px" data-t="fill.tap"></div>
  <div class="chip" style="left:1250px;top:440px"><span>🪣</span><b data-t="fill.chip"></b></div>
  <div class="chip" style="left:1250px;top:600px"><span>🎨</span><b data-t="fill.chip2"></b></div>
</section>

<!-- 5. 글자 ─────────────────────────────── -->
<section class="scene" id="text">
  <div class="head"><h1 data-t="text.h"></h1><p data-t="text.p"></p></div>
  <div class="tablet" style="left:350px;top:262px;width:900px"><div class="glass"><img data-src="card_ui"></div></div>
  <div class="chip" style="left:110px;top:420px"><span>🔤</span><b data-t="text.c1"></b></div>
  <div class="chip" style="left:90px;top:620px"><span>🤏</span><b data-t="text.c2"></b></div>
  <div class="chip" style="left:1270px;top:520px"><span>🧽</span><b data-t="text.c3"></b></div>
</section>

<!-- 6. 폴더블 ───────────────────────────── -->
<section class="scene" id="fold">
  <div class="head"><h1 data-t="fold.h"></h1><p data-t="fold.p"></p></div>
  <div class="fold" style="left:320px;top:270px;width:910px"><div class="glass"><img data-src="duo"></div></div>
  <div class="chip" style="left:90px;top:440px"><span>🧰</span><b data-t="fold.c1"></b></div>
  <div class="chip" style="left:1240px;top:600px"><span>📐</span><b data-t="fold.c2"></b></div>
</section>

<script>
const T = {
  ko: {
    'hero.h':'손도 펜도 <em>자유롭게</em>', 'hero.p':'펜촉 다섯 가지 · 필압 · 도형 인식 · 페인트통 · 글자',
    'c.pens':'펜촉 5종', 'c.pressure':'필압 인식', 'c.shapes':'도형 자동 보정', 'c.fill':'한 번에 채우기',
    'pens.h':'펜촉마다 <em>다른 손맛</em>', 'pens.p':'둥근펜 · 연필 · 납작펜 · 형광펜 · 캘리그래피',
    'pens.hl':'겹칠수록 진해지는 형광펜', 'pens.pr':'누르는 만큼 굵게', 'pens.cal':'방향 따라 굵기가 바뀌는 캘리그래피',
    'shapes.h':'삐뚤게 그려도 <em>반듯하게</em>', 'shapes.p':'그리고 펜을 떼기 전에 잠깐 멈추면 정리됩니다',
    'shapes.before':'손으로 그린 그대로', 'shapes.after':'잠깐 멈췄을 때', 'shapes.hold':'잠깐 멈추면', 'shapes.undo':'되돌리기 한 번이면 손그림으로',
    'fill.h':'닫힌 곳은 <em>한 번에</em>', 'fill.p':'페인트통으로 탭하면 그 영역만 채워집니다',
    'fill.tap':'탭!', 'fill.chip':'선 가장자리까지 깔끔하게', 'fill.chip2':'원하는 색 아무거나',
    'text.h':'그림 위에 <em>글자까지</em>', 'text.p':'옮기고, 키우고, 돌리고 — 글자도 그림의 일부',
    'text.c1':'한글 서체 6종', 'text.c2':'두 손가락으로 크기·회전', 'text.c3':'지우개로 지우기',
    'fold.h':'펼치면 <em>더 넓게</em>', 'fold.p':'폴더블 휴대폰의 펼친 화면에 맞춘 배치',
    'fold.c1':'도구 막대가 늘 보이게', 'fold.c2':'접었다 펴도 그림은 그대로'
  },
  en: {
    'hero.h':'Finger or pen, <em>your call</em>', 'hero.p':'Five pen tips · pressure · shape snap · paint bucket · text',
    'c.pens':'5 pen tips', 'c.pressure':'Pressure', 'c.shapes':'Shape snap', 'c.fill':'One-tap fill',
    'pens.h':'Every tip <em>feels different</em>', 'pens.p':'Round · pencil · flat · highlighter · calligraphy',
    'pens.hl':'Highlighter deepens as it overlaps', 'pens.pr':'Press harder, draw thicker', 'pens.cal':'Calligraphy thick and thin',
    'shapes.h':'Wobbly in, <em>clean out</em>', 'shapes.p':'Pause for a moment before lifting the pen',
    'shapes.before':'As drawn', 'shapes.after':'After a short pause', 'shapes.hold':'Hold still', 'shapes.undo':'One undo brings your drawing back',
    'fill.h':'Fill it in <em>one tap</em>', 'fill.p':'Tap inside an outline and only that area fills',
    'fill.tap':'Tap!', 'fill.chip':'Clean right up to the line', 'fill.chip2':'Any colour you like',
    'text.h':'Words on the <em>drawing</em>', 'text.p':'Move it, size it, turn it — text is part of the picture',
    'text.c1':'Six built-in typefaces', 'text.c2':'Two fingers to size and rotate', 'text.c3':'Erasable like any stroke',
    'fold.h':'Unfold it, <em>draw bigger</em>', 'fold.p':'Laid out for the open screen of a foldable phone',
    'fold.c1':'Toolbar always in view', 'fold.c2':'Fold and unfold, the drawing stays'
  },
  ja: {
    'hero.h':'指でもペンでも<em>思いのままに</em>', 'hero.p':'5種類のペン先・筆圧・図形補正・塗りつぶし・文字',
    'c.pens':'ペン先5種類', 'c.pressure':'筆圧対応', 'c.shapes':'図形補正', 'c.fill':'ワンタップ塗り',
    'pens.h':'ペン先ごとに<em>違う描き味</em>', 'pens.p':'丸ペン・鉛筆・平ペン・蛍光ペン・カリグラフィー',
    'pens.hl':'重ねて濃くなる蛍光ペン', 'pens.pr':'押した分だけ太く', 'pens.cal':'カリグラフィーの強弱',
    'shapes.h':'ゆがんでも<em>まっすぐに</em>', 'shapes.p':'ペンを離す前に少し止めると整います',
    'shapes.before':'描いたまま', 'shapes.after':'少し止めると', 'shapes.hold':'少し止める', 'shapes.undo':'取り消し1回で手描きに戻る',
    'fill.h':'囲んだ場所を<em>ワンタップで</em>', 'fill.p':'バケツでタップすると、その範囲だけが塗られます',
    'fill.tap':'タップ!', 'fill.chip':'線のきわまできれいに', 'fill.chip2':'好きな色を自由に',
    'text.h':'絵の上に<em>文字も</em>', 'text.p':'動かして、大きくして、回して — 文字も絵の一部',
    'text.c1':'内蔵の6書体', 'text.c2':'2本指でサイズと回転', 'text.c3':'消しゴムで消せる',
    'fold.h':'開けば<em>もっと広く</em>', 'fold.p':'折りたたみスマホの開いた画面に合わせたレイアウト',
    'fold.c1':'ツールバーが常に表示', 'fold.c2':'開閉しても絵はそのまま'
  }
};
// ui 캡처 안에서 페이지(캔버스)가 차지하는 자리 — landing_art.dart 의 PAGE: 줄
const PAGE = {l: 98/2752, t: 98/2064, w: 2556/2752, h: 1868/2064};

const q = new URLSearchParams(location.hash.slice(1));
const scene = q.get('scene') || 'hero', lang = q.get('lang') || 'ko';
document.documentElement.lang = lang;
document.getElementById(scene).classList.add('on');
for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = T[lang][el.dataset.t] || '';
for (const img of document.querySelectorAll('img[data-src]'))
  img.src = 'raw/' + img.dataset.src + (img.hasAttribute('data-nolang') ? '' : '_' + lang) + '.jpg';
// 확대경: "그림 u v 폭" — 그림의 (u,v) 지점을 가운데에, 그림 폭의 그만큼을 보여 준다
for (const el of document.querySelectorAll('[data-lens]')) {
  const [name, u, v, z] = el.dataset.lens.split(' ');
  const d = el.offsetWidth - 14, W = d / z, H = W * 1868 / 2556;
  el.style.backgroundImage = `url(raw/${name}_${lang}.jpg)`;
  el.style.backgroundSize = `${W}px ${H}px`;
  el.style.backgroundPosition = `${d / 2 - u * W}px ${d / 2 - v * H}px`;
}
// 탭 표시: 페이지 좌표 → 캡처 안 위치
for (const el of document.querySelectorAll('[data-at]')) {
  const [u, v] = el.dataset.at.split(' ').map(Number);
  el.style.left = (PAGE.l + u * PAGE.w) * 100 + '%';
  el.style.top = (PAGE.t + v * PAGE.h) * 100 + '%';
}
// 헤드라인이 넘치면 줄인다
for (const h of document.querySelectorAll('.scene.on h1')) {
  let s = 72; while (h.scrollWidth > h.clientWidth + 1 && s > 44) h.style.fontSize = (s -= 2) + 'px';
}
</script>
</body></html>
